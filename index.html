<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smartphonehacks247 | Smartphone Hacks, Reviews & Tips</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --surface: #fff;
      --text: #111827;
      --muted: #5b6475;
      --line: #e5e8f0;
      --accent: #4f6bff;
      --accent2: #3a52e0;
      --soft: #eef1ff;
      --shadow: 0 10px 30px -12px rgba(30,45,100,.18);
    }
    [data-theme=dark] {
      --bg: #0d1120;
      --surface: #151a2e;
      --text: #f1f4ff;
      --muted: #a3adc7;
      --line: #252c47;
      --accent: #6b82ff;
      --accent2: #8497ff;
      --soft: #1b2243;
      --shadow: 0 10px 30px -12px rgba(0,0,0,.6);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Inter, system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.65;
      transition: background .25s, color .25s;
    }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
    
    /* Header */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
    }
    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 70px;
    }
    .logo {
      font-weight: 800;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo img {
      height: 36px;
      width: auto;
      border-radius: 4px;
      display: block;
    }
    .nav-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .menu {
      display: flex;
      gap: 5px;
    }
    .menu a {
      padding: 8px 12px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--muted);
    }
    .menu a:hover, .menu a.on { color: var(--accent); background: var(--soft); }
    
    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--surface);
    }
    .icon-btn svg { width: 20px; height: 20px; fill: currentColor; }
    .burger { display: none; }

    /* Main Layout */
    main { max-width: 1200px; margin: 20px auto; padding: 0 15px; min-height: 70vh; }

    /* Grid Section */
    .section-header { margin-bottom: 25px; }
    .section-header h2 { font-size: 1.8rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 25px; }
    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s;
    }
    .card:hover { transform: translateY(-5px); }
    .card-img { height: 200px; background: #eee; }
    .card-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .card-body { padding: 20px; display: flex; flex-direction: column; gap: 10px; flex-grow: 1; }
    .card-meta { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--muted); }
    .card-body h3 { font-size: 1.2rem; }
    .card-body p { color: var(--muted); font-size: 0.9rem; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

    /* Responsive adjustments */
    @media (max-width: 850px) {
      .menu {
        display: none;
        flex-direction: column;
        position: absolute;
        top: 70px;
        left: 0;
        right: 0;
        background: var(--surface);
        padding: 20px;
        border-bottom: 1px solid var(--line);
        box-shadow: var(--shadow);
      }
      .menu.active { display: flex; }
      .burger { display: flex; }
    }
  </style>
</head>
<body>

<header>
  <div class="nav-container">
    <a href="#" class="logo">
      <img src="smartphonehacks247_under_1mb.jpg" alt="Logo">
      Smartphonehacks247
    </a>
    <nav class="menu" id="navMenu">
      <a href="#" class="on">Home</a>
      <a href="#app">Articles</a>
    </nav>
    <div class="nav-right">
      <button class="icon-btn" id="themeToggle" aria-label="Toggle Theme">
        <svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <button class="icon-btn burger" id="burgerToggle" aria-label="Toggle Menu">
        <svg viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
    </div>
  </div>
</header>

<main id="app">
  <!-- Posts will be dynamically loaded here -->
</main>

<footer>
  <div style="text-align: center; padding: 40px; color: var(--muted);">
    <p>&copy; 2026 Smartphonehacks247. All rights reserved.</p>
  </div>
</footer>

<script src="posts.js"></script>
<script>
  // Theme Toggle
  const themeToggle = document.getElementById('themeToggle');
  themeToggle.addEventListener('click', () => {
    document.documentElement.toggleAttribute('data-theme');
  });

  // Mobile Menu Toggle
  const burgerToggle = document.getElementById('burgerToggle');
  const navMenu = document.getElementById('navMenu');
  burgerToggle.addEventListener('click', () => {
    navMenu.classList.toggle('active');
  });

  // Render Posts from posts.js
  const appContainer = document.getElementById('app');
  if (window.POSTS && Array.isArray(window.POSTS)) {
    let postsHTML = '<section id="articles"><div class="section-header"><h2>Latest Articles</h2></div><div class="grid">';
    postsHTML += window.POSTS.map(post => `
      <article class="card">
        <div class="card-img">
          <img src="${post.image || 'https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=800'}" alt="${post.title}">
        </div>
        <div class="card-body">
          <div class="card-meta">
            <span>${post.category || 'General'}</span>
            <span>${post.readTime || '5 min read'}</span>
          </div>
          <h3>${post.title}</h3>
          <p>${post.excerpt || ''}</p>
        </div>
      </article>
    `).join('');
    postsHTML += '</div></section>';
    appContainer.innerHTML = postsHTML;
  } else {
    appContainer.innerHTML = '<section id="articles" style="text-align:center; padding: 50px;"><p>Loading posts or posts.js not found.</p></section>';
  }
</script>
</body>
</html>
