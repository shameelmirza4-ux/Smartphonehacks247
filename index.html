<!DOCTYPE html>
<html data-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SmartphoneHacks247 - Smartphone Reviews, Tips &amp; Tricks</title>
    <meta name="description" content="Smart smartphone reviews, expert tips, mobile tricks and optimization guides.">
    <meta name="theme-color" content="#4f6bff">
    <link rel="canonical" href="https://shameelmirza.github.io/">
    <meta property="og:type" content="website">
    <meta property="og:title" content="SmartphoneHacks247 - Smartphone Reviews, Tips &amp; Tricks">
    <meta property="og:description" content="Smart smartphone reviews, expert tips, mobile tricks and optimization guides.">
    <meta property="og:url" content="https://shameelmirza.github.io/">
    <meta property="twitter:card" content="summary_large_image">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f6bff;
            --primary-dark: #3b53db;
            --bg: #f8fafc;
            --surface: #ffffff;
            --text: #0f172a;
            --text-secondary: #475569;
            --border: #e2e8f0;
            --radius: 12px;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
        }
        [data-theme="dark"] {
            --bg: #0f172a;
            --surface: #1e293b;
            --text: #f8fafc;
            --text-secondary: #94a3b8;
            --border: #334155;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
        header { background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
        .nav-container { max-width: 1200px; margin: 0 auto; padding: 1rem 1.5rem; display: flex; align-items: center; justify-content: space-between; }
        .logo { display: flex; align-items: center; gap: 0.75rem; text-decoration: none; color: var(--text); font-weight: 700; font-size: 1.25rem; }
        .logo img { height: 36px; width: auto; }
        .nav-actions { display: flex; align-items: center; gap: 1rem; }
        .theme-toggle { background: none; border: 1px solid var(--border); color: var(--text); padding: 0.5rem; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; }
        main { max-width: 1200px; margin: 2rem auto; padding: 0 1.5rem; }
        .hero-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); margin-bottom: 2rem; display: grid; grid-template-columns: 1fr; }
        @media(min-width: 768px) { .hero-card { grid-template-columns: 1.2fr 1fr; } }
        .hero-img { width: 100%; height: 280px; object-fit: cover; }
        @media(min-width: 768px) { .hero-img { height: 100%; min-height: 350px; } }
        .hero-content { padding: 2rem; display: flex; flex-direction: column; justify-content: center; }
        .badge { background: #ffaa00; color: #000; font-weight: 700; font-size: 0.75rem; text-transform: uppercase; padding: 0.25rem 0.75rem; border-radius: 20px; width: fit-content; margin-bottom: 1rem; }
        .hero-title { font-size: 1.75rem; font-weight: 800; margin-bottom: 1rem; line-height: 1.2; }
        .hero-desc { color: var(--text-secondary); margin-bottom: 1.5rem; }
        .btn { background: var(--primary); color: #fff; padding: 0.75rem 1.5rem; border-radius: var(--radius); border: none; font-weight: 600; cursor: pointer; text-decoration: none; width: fit-content; transition: background 0.2s; }
        .btn:hover { background: var(--primary-dark); }
        .section-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 1.5rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.5rem; margin-bottom: 3rem; }
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); display: flex; flex-direction: column; }
        .card-img { width: 100%; height: 180px; object-fit: cover; }
        .card-body { padding: 1.5rem; display: flex; flex-direction: column; flex-grow: 1; }
        .card-meta { font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.5rem; }
        .card-title { font-size: 1.15rem; font-weight: 700; margin-bottom: 0.75rem; line-height: 1.4; }
        .card-desc { color: var(--text-secondary); font-size: 0.95rem; margin-bottom: 1.5rem; flex-grow: 1; }
        .site-footer { background: var(--surface); border-top: 1px solid var(--border); padding: 3rem 0; margin-top: 4rem; }
        .footer-grid { max-width: 1200px; margin: 0 auto; padding: 0 1.5rem; display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 2rem; }
        .footer-grid h4 { font-size: 1.1rem; font-weight: 700; margin-bottom: 1rem; }
        .footer-grid ul { list-style: none; }
        .footer-grid li { margin-bottom: 0.5rem; }
        .footer-grid a { color: var(--text-secondary); text-decoration: none; transition: color 0.2s; }
        .footer-grid a:hover { color: var(--primary); }
        .article-full { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 2rem; margin-top: 2rem; display: none; }
        .article-full h1 { font-size: 2rem; margin-bottom: 1rem; }
        .article-full p { margin-bottom: 1rem; color: var(--text-secondary); }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <a href="#" class="logo">
                <img src="https://shameelmirza.github.io/img/logo.png" alt="Logo">
                <span>SmartphoneHacks247</span>
            </a>
            <div class="nav-actions">
                <button class="theme-toggle" id="themeToggle" aria-label="Toggle Theme">🌙</button>
            </div>
        </div>
    </header>

    <main>
        <div id="articleView" style="display:none;">
            <button class="btn" id="back-home" style="margin-bottom: 1.5rem;">← Back to Home</button>
            <div id="fullArticleContent"></div>
        </div>

        <div id="homeView">
            <section class="hero-section" id="heroSection">
                <!-- Hero content loaded via JS -->
            </section>

            <h2 class="section-title">Editor's Picks</h2>
            <div class="grid" id="editorsPicks">
                <!-- Grid content loaded via JS -->
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="footer-grid">
            <div>
                <h4>SmartphoneHacks247</h4>
                <p style="color: var(--text-secondary); font-size: 0.95rem;">Honest phone reviews, smart tips and hidden tricks — plus breaking mobile tech news, around the clock.</p>
            </div>
            <div>
                <h4>Explore Topics</h4>
                <ul>
                    <li><a href="#" data-cat="Android">Android Tips</a></li>
                    <li><a href="#" data-cat="Reviews">Phone Reviews</a></li>
                    <li><a href="#" data-cat="Battery">Battery Hacks</a></li>
                    <li><a href="#" data-cat="Camera">Camera Secrets</a></li>
                </ul>
            </div>
            <div>
                <h4>Contact Us</h4>
                <p style="font-size: 0.95rem; margin-bottom: 0.5rem;"><a href="mailto:contact@smartphonehacks247.github.io">contact@smartphonehacks247.github.io</a></p>
            </div>
        </div>
    </footer>

    <script>
    (function() {
        var IMG = 'https://shameelmirza.github.io/img/';
        var posts = [
            {
                h: 'Flagship Showdown Review: The Best Camera Phone of 2026 Is Not the One You Think',
                p: 'Each phone ran the same routine: a grueling day of shooting, gaming, and draining batteries on this year’s top flagships. One phone quietly beat them all on consistency.',
                img: IMG + 'flagship.jpg',
                cat: 'Reviews',
                date: 'Nov 3, 2026',
                read: '2 min read',
                content: 'Detailed review content goes here. Each flagship camera was tested under extreme low-light conditions, portrait lighting, and fast motion tracking.'
            },
            {
                h: 'Breaking: The Next Wave of Foldables Is Thinner, Tougher, and Finally Practical',
                p: 'Our winner kept natural hinge angles and eliminated crease glare. Here is how the new crop compares in durability tests.',
                img: IMG + 'foldable.jpg',
                cat: 'News',
                date: 'Nov 2, 2026',
                read: '3 min read',
                content: 'Foldable devices have taken a major leap forward with advanced titanium hinges and scratch-resistant ultra-thin glass layers.'
            },
            {
                h: '12 Battery Hacks That Actually Work (And 5 Myths You Can Stop Believing)',
                p: 'Smart Battery Management, Adaptive Refresh Rates, and Background Execution Limits tested.',
                img: IMG + 'battery.jpg',
                cat: 'Battery & Performance',
                date: 'Nov 1, 2026',
                read: '4 min read',
                content: 'Battery optimization guidelines for modern Android and iOS devices to maximize daily screen-on time.'
            },
            {
                h: '15 Hidden Android Features You’re Probably Not Using',
                p: 'Master quick split-screen toggles, hidden developer settings, and custom privacy shortcuts.',
                img: IMG + 'android.jpg',
                cat: 'Tips & Hacks',
                date: 'Oct 30, 2026',
                read: '3 min read',
                content: 'Deep dive into hidden configuration menus and gesture shortcuts available on your Realme and Android smartphones.'
            },
            {
                h: 'Pro Camera Phone Review: Computational Photography vs. Sensor Size',
                p: 'Larger sensors capture intrinsic light, but AI processing cleans up noise in impossible ways.',
                img: IMG + 'camera.jpg',
                cat: 'Camera',
                date: 'Oct 28, 2026',
                read: '5 min read',
                content: 'Exploring how smartphone manufacturers balance physical glass optics with heavy neural network image pipelines.'
            },
            {
                h: 'Does Fast Charging Ruin Your Battery? The 6-Month Test Results',
                p: 'We tested 120W charging bricks against standard 25W adapters over half a year of constant use.',
                img: IMG + 'charging.jpg',
                cat: 'Battery & Performance',
                date: 'Oct 25, 2026',
                read: '3 min read',
                content: 'Long-term data collection on battery health degradation under high-wattage fast charging protocols.'
            }
        ];

        // Theme Toggle Logic
        var themeToggle = document.getElementById('themeToggle');
        var htmlElem = document.documentElement;
        themeToggle.addEventListener('click', function() {
            var currentTheme = htmlElem.getAttribute('data-theme');
            if(currentTheme === 'light') {
                htmlElem.setAttribute('data-theme', 'dark');
                themeToggle.textContent = '☀️';
            } else {
                htmlElem.setAttribute('data-theme', 'light');
                themeToggle.textContent = '🌙';
            }
        });

        // Render Hero & Grid
        var heroElem = document.getElementById('heroSection');
        var gridElem = document.getElementById('editorsPicks');

        if(heroElem && posts.length > 0) {
            var topPost = posts[0];
            heroElem.innerHTML = `
                <div class="hero-card">
                    <img src="${topPost.img}" alt="${topPost.h}" class="hero-img">
                    <div class="hero-content">
                        <span class="badge">Top Story</span>
                        <h1 class="hero-title">${topPost.h}</h1>
                        <p class="hero-desc">${topPost.p}</p>
                        <button class="btn read-more-btn" data-index="0">Read full review</button>
                    </div>
                </div>
            `;
        }

        if(gridElem) {
            var gridHtml = '';
            for(var i = 1; i < posts.length; i++) {
                gridHtml += `
                    <div class="card">
                        <img src="${posts[i].img}" alt="${posts[i].h}" class="card-img">
                        <div class="card-body">
                            <div class="card-meta">${posts[i].date} • ${posts[i].read}</div>
                            <h3 class="card-title">${posts[i].h}</h3>
                            <p class="card-desc">${posts[i].p}</p>
                            <button class="btn read-more-btn" data-index="${i}">Read full review</button>
                        </div>
                    </div>
                `;
            }
            gridElem.innerHTML = gridHtml;
        }

        // Open full article view
        document.addEventListener('click', function(e) {
            if(e.target && e.target.classList.contains('read-more-btn')) {
                var idx = e.target.getAttribute('data-index');
                var post = posts[idx];
                document.getElementById('homeView').style.display = 'none';
                document.getElementById('articleView').style.display = 'block';
                document.getElementById('fullArticleContent').innerHTML = `
                    <h1>${post.h}</h1>
                    <p><strong>Published:</strong> ${post.date} • ${post.read}</p>
                    <img src="${post.img}" alt="${post.h}" style="width:100%; max-height:400px; object-fit:cover; border-radius:12px; margin: 1.5rem 0;">
                    <p>${post.content}</p>
                    <p>${post.p}</p>
                `;
                window.scrollTo({top: 0, behavior: 'smooth'});
            }
        });

        var backHomeBtn = document.getElementById('back-home');
        if(backHomeBtn) {
            backHomeBtn.addEventListener('click', function() {
                document.getElementById('articleView').style.display = 'none';
                document.getElementById('homeView').style.display = 'block';
                window.scrollTo({top: 0, behavior: 'smooth'});
            });
        }
    })();
    </script>
</body>
</html>
